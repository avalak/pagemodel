[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pagemodel"
version = "0.2.0"
description = "A declarative HTML/XML extraction framework using lxml"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "lxml[cssselect]>=4.9.0",
]
authors = [
    {name = "Avalak", email = "avalak.box+pagemodel@gmail.com"}
]
urls = {repository = "https://github.com/avalak/pagemodel", documentation = "https://avalak.github.io/pagemodel"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: XML",
]


[project.optional-dependencies]
all = ["pagemodel[pydantic,orjson]"]
pydantic = ["pydantic>=1.0,<3.0"]
orjson = ["orjson"]


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-static-i18n>=1.3.1",
    "mike>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pagemodel"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tests/*", "benchmark.py", "script.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
#    "C901",   # Enable McCabe complexity checks
    "RUF022", # unsorted-dunder-all
]
ignore = ["B008"]  # allow lambdas in field definitions

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
